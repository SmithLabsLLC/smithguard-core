pid /tmp/smithguard-nginx-test.pid;
error_log stderr;

events {}

http {
    client_body_temp_path local/nginx-test/client_body;
    proxy_temp_path local/nginx-test/proxy;
    fastcgi_temp_path local/nginx-test/fastcgi;
    uwsgi_temp_path local/nginx-test/uwsgi;
    scgi_temp_path local/nginx-test/scgi;
    include ../deploy/nginx/smithguard.conf;
}
