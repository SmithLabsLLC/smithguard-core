name: Improvement proposal
description: Suggest a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Evidence, scope and tradeoffs
