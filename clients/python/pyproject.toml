[project]
name = "smithguard-client"
version = "0.1.0"
description = "Explicitly authorized local Python metadata checks through hosted SmithGuard"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
authors = [{name = "Smith Labs, LLC"}]
dependencies = [
  "cryptography==50.0.1",
  "httpx==0.28.1",
  "jsonschema[format-nongpl]==4.26.0",
  "packaging==26.3",
]

[project.scripts]
smithguard-client = "smithguard_client.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "hatchling==1.32.4"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smithguard_client"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version", "/THIRD_PARTY_NOTICES.md", "/tests", "/generate_schema.py", "/.gitignore"]

# Initial client lock matches the already qualified service dependency versions.
[tool.uv]
constraint-dependencies = [
  "certifi==2026.10.19",
  "fqdn==1.5.1",
  "jsonpointer==3.1.1",
  "pycparser==3.0",
  "python-dateutil==2.9.0.post0",
  "rpds-py==2026.6.3",
  "tzdata==2026.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
